services:
  pr-qa:
    build:
      context: .
      dockerfile: Dockerfile.pr-qa
    env_file: .env
    environment:
      QA_DATA_DIR: /data
      QA_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - qa-data:/data
      - canary-sessions:/home/node/.canary/sessions
    init: true
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  qa-data:
  canary-sessions:
