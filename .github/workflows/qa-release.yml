name: QA image release
on:
  workflow_dispatch:
  push:
    tags: ["qa-v*"]
permissions:
  contents: read
concurrency:
  group: qa-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'Noext/canary'
    # Same self-hosted container as ci.yml: see the note on the `check` job
    # there before changing this or adding a step that needs root.
    runs-on: [self-hosted, linux, x64, canary-ci]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: 9.15.0, dest: '~/setup-pnpm-${{ runner.name }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Build candidate image
        run: docker build -f Dockerfile.pr-qa -t canary-pr-qa:release .
      - name: Test fresh Compose installation before publishing
        run: pnpm --filter @usecanary/pr-qa test:container
        env: {CANARY_DOCKER_IMAGE: 'canary-pr-qa:release'}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: canary-pr-qa:release
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: canary-pr-qa:release
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          QA_REGISTRY_IMAGE="ghcr.io/${OWNER,,}/canary-pr-qa"
          printf 'name=%s\n' "$QA_REGISTRY_IMAGE" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Publish the exact tested and scanned image
        id: publish
        env:
          QA_IMAGE_NAME: ${{ steps.identity.outputs.name }}
          QA_IMAGE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          docker tag canary-pr-qa:release "$QA_IMAGE_NAME:$QA_IMAGE_TAG"
          docker push "$QA_IMAGE_NAME:$QA_IMAGE_TAG"
          QA_IMAGE_DIGEST=$(docker image inspect "$QA_IMAGE_NAME:$QA_IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          printf 'digest=%s\n' "${QA_IMAGE_DIGEST#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.identity.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa-release-evidence
          path: |
            sbom.spdx.json
            /tmp/canary-container-*/service.log
