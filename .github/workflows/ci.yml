name: CI

on:
  # `feat/autonomous-pr-qa` used to be listed here and no longer exists (the
  # remote only has `main`, `baseline-8143ac9` and short-lived topic branches).
  # Recreating it would have produced a second full `check` for every push of a
  # branch whose PR already triggers one.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes another one on the same ref must not keep an obsolete
# run on the `canary-ci` runners: they are shared, non-ephemeral LXC containers
# and there are only two of them, so a stale run delays the one the PR is
# actually waiting for. Measured before this block existed: 45 minutes of
# cumulative queue across 60 runs, 24 of them waiting 38-218 s behind a
# superseded sibling (`feat/canary-replay` alone produced 34 runs, 33 of them
# replaced by the next push).
#
# `cancel-in-progress` is restricted to pull requests on purpose: a push to
# `main` is a merge commit and its CI result is the record of that merge, so a
# later push must never cancel it. `pull_request` events share the group
# `refs/pull/<n>/merge`, which is exactly the "same PR" scope we want.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Self-hosted: the runner is the LXC container `gh-runner` (CT 126,
    # 192.168.103.47) provisioned by Noext/infra-agent-cts, role `ghrunner`.
    # `canary-ci` is a custom label, so this job can never land on an unrelated
    # self-hosted runner. See the "Self-hosted CI runner" section of the
    # README for what the container provides — in particular why no step here
    # may assume `sudo`.
    runs-on: [self-hosted, linux, x64, canary-ci]
    timeout-minutes: 30
    # This job used a `services:` PostgreSQL published on the fixed host port
    # 5432. A host port is a host-wide resource, so a second `check` job could
    # not start its own database, and the port was reachable from the network the
    # runner shares. The database is now a container this job starts on a
    # Docker-assigned free port bound to 127.0.0.1, and `QA_TEST_DATABASE_URL` is
    # exported by that step. No step of this job may publish a fixed host port
    # again; see the note in the README table on what the runner provides.
    env:
      # Scoped to a run and an attempt, so the teardown only ever addresses the
      # container this job started and can never match a sibling job's.
      POSTGRES_CONTAINER: canary-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint and format check (ultracite/biome)
        run: pnpm lint

      # `pnpm check` runs apps/canary-pr-qa/test/native-postgres.test.ts, which
      # skips itself when `QA_TEST_DATABASE_URL` is unset: that step is the only
      # consumer of this database in the job, so the container brackets it.
      # Nothing needs the port before the container exists, so Docker picks a
      # free one itself: the `freePort()` probe in
      # apps/canary-pr-qa/test/container.test.ts exists because that test must
      # know its port before the first `docker compose up`, which is not the case
      # here, and a probe would leave a window between closing the socket and
      # `--publish` actually binding it.
      - name: Start a disposable PostgreSQL on a Docker-assigned free port
        env:
          POSTGRES_IMAGE: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        run: |
          set -euo pipefail
          password="ci-disposable-password"
          # A rerun of this attempt, or a job of this same run killed before its
          # teardown, must not turn into a name conflict. The name is scoped to a
          # run and an attempt, so this can never reach a sibling job's container.
          docker container rm --force --volumes "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          # An empty host port asks Docker for a free one, and 127.0.0.1 keeps the
          # database off the network the runner shares.
          docker run --detach --name "$POSTGRES_CONTAINER" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=canary \
            --env POSTGRES_PASSWORD="$password" \
            --env POSTGRES_DB=canary \
            "$POSTGRES_IMAGE"
          port="$(docker port "$POSTGRES_CONTAINER" 5432/tcp | head -n1 | sed 's/.*://')"
          # `pg_isready` over the container's own TCP listener, not over its unix
          # socket: the socket answers while the image is still running initdb,
          # the TCP listener only once the real server serves connections. The
          # `sleep` paces the probe, it is never the proof of readiness.
          ready=no
          for _ in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready \
                 --host 127.0.0.1 --port 5432 --username canary --dbname canary >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            docker logs --tail 50 "$POSTGRES_CONTAINER" || true
            echo "::error::$POSTGRES_CONTAINER never accepted connections on 127.0.0.1:$port"
            exit 1
          fi
          # The tests below connect to the published port rather than to the
          # container's loopback, so one connect from the runner proves Docker
          # really published it here instead of leaving that to fail inside a
          # test much later.
          timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port"
          printf 'QA_TEST_DATABASE_URL=postgresql://canary:%s@127.0.0.1:%s/canary\n' "$password" "$port" >> "$GITHUB_ENV"
          echo "$POSTGRES_CONTAINER ready on 127.0.0.1:$port"

      # On the self-hosted runner the container already provides Chromium's
      # system libraries (role `ghrunner`) and the `gh-runner` account has no
      # sudoers entry, so `--with-deps` would fail there. On a GitHub-hosted
      # runner the opposite holds. Keep both paths working instead of assuming
      # one of them.
      - name: Install Playwright browsers (for daemon + canary tests)
        run: |
          if sudo -n true 2>/dev/null; then
            pnpm --filter @usecanary/daemon exec playwright install --with-deps chromium
          else
            pnpm --filter @usecanary/daemon exec playwright install chromium
          fi

      - run: pnpm check

      # The one step that consumed the database is over. `if: always()` is the
      # point, and the container is addressed by its run-scoped name rather than
      # by any filter, so a failing job cannot leak its database and cannot touch
      # a sibling job's.
      - name: Stop the disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect "$POSTGRES_CONTAINER" >/dev/null 2>&1; then
            docker container rm --force --volumes "$POSTGRES_CONTAINER"
          fi

      - name: Install embedded Canary runtime
        run: node apps/canary/dist/cli.js install

      - name: Autonomous PR QA E2E (real Chromium, fixture GitHub and AI APIs)
        run: pnpm --filter @usecanary/pr-qa test:e2e

      # The runner is not ephemeral and its Docker daemon is shared with every
      # other job. A job killed mid-step (run 38362415208, 2026-10-13) was killed
      # by ENOSPC and never ran a cleanup, so its dangling image and its build
      # cache stayed on the disk and the next run inherited a full container.
      # Reclaiming that inheritance before building is what makes the disk heal
      # itself instead of needing a manual purge.
      - name: Reclaim disk inherited from a run that was killed before its cleanup
        run: |
          docker system df
          # Dangling only. Without `-a`, a tagged image a sibling job may still
          # be testing is never a candidate.
          docker image prune -f
          # A cache record untouched for over an hour cannot belong to a build
          # still running here (`check` is capped at 30 minutes), while a sibling
          # job keeps the warm cache it just produced. Records older than that are
          # what accumulated to 24.6 GB / 157 entries before this step existed.
          docker builder prune -f --filter until=1h
          docker system df

      - name: Build production Docker image from a clean context
        run: docker build -f Dockerfile.pr-qa -t canary-pr-qa:test .

      - name: First-install Compose E2E (new volumes, real Chromium, doctor and GitHub reports)
        run: pnpm --filter @usecanary/pr-qa test:container
        env:
          CANARY_DOCKER_IMAGE: canary-pr-qa:test

      # `if: always()` is the whole point: a job that fails or is killed is the
      # one that leaves everything behind. This run's build retagged
      # `canary-pr-qa:test`, so the image it orphaned is reclaimable now instead
      # of by the next run. No Compose teardown here: the test already runs
      # `docker compose down --volumes --remove-orphans` on its own random
      # project, and a second, blind `down` could hit a sibling job.
      - name: Reclaim what this run built, even when the job fails
        if: always()
        run: |
          docker system df
          # Dangling only, and never the still-tagged image of a running sibling.
          docker image prune -f
          # Unfiltered on purpose: this run is over, so its own build cache has no
          # reader left, and a build in progress elsewhere keeps its own records.
          docker builder prune -f
          docker system df

      - name: Preserve container diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-qa-container-logs
          path: /tmp/canary-container-*/service.log
          if-no-files-found: ignore

  # Architecture intelligence for the two UI-facing workspaces. Runs on its own
  # runner so a score regression is reported as one fast job, independent from
  # the 30-minute check chain.
  architecture:
    name: Architecture gate (arcovia)
    # Same runner as `check`: see the note above.
    runs-on: [self-hosted, linux, x64, canary-ci]
    timeout-minutes: 15
    env:
      ARCOVIA_VERSION: 0.2.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # arcovia is not a workspace dependency: it is fetched at an exact
      # version and checked against its published tarball digest, the same way
      # this workflow pins actions by SHA and the Postgres image by digest.
      # It is never added to the lockfile, so `pnpm audit --prod` stays
      # unaffected. The analysis itself needs no node_modules.
      - name: Install arcovia (pinned version, verified tarball)
        env:
          ARCOVIA_TARBALL_SHA512: "kpMmNTutUDINLhszppwZl24nou+VDN7iel2GGFhdtxZeWhkRtqYlgUzogVNvHpYfyZs3Ik5ZwR4bIIy+swazvw=="
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arcovia-$ARCOVIA_VERSION.tgz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://registry.npmjs.org/arcovia/-/arcovia-$ARCOVIA_VERSION.tgz"
          actual="$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          if [ "$actual" != "$ARCOVIA_TARBALL_SHA512" ]; then
            echo "::error::arcovia $ARCOVIA_VERSION tarball digest mismatch"
            exit 1
          fi
          npm install --global --no-fund --no-audit "$archive"
          arcovia --version

      - name: Analyze architecture (arcovia)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arcovia"
          arcovia analyze apps/canary-ui --json \
            --output "$RUNNER_TEMP/arcovia/canary-ui"
          arcovia analyze apps/canary-pr-qa --json \
            --output "$RUNNER_TEMP/arcovia/pr-qa"
          arcovia analyze apps/canary-pr-qa-ui --json \
            --output "$RUNNER_TEMP/arcovia/pr-qa-ui"

      # The thresholds are floors recorded from a measurement of this commit,
      # never aspirational targets: a lower score than these values means the
      # pull request added architectural debt. See the README.
      # Measured when the floors were recorded: canary-ui 80.77, pr-qa 94.57,
      # pr-qa-ui 97.25 (the React dashboard, which this gate now covers so it
      # cannot rot behind the imperative code it replaced).
      - name: Architecture score gate
        run: |
          set -euo pipefail
          node scripts/arcovia-gate.mjs \
            --target apps/canary-ui \
            --report "$RUNNER_TEMP/arcovia/canary-ui/analysis.json" \
            --min-score 75 \
            --target apps/canary-pr-qa \
            --report "$RUNNER_TEMP/arcovia/pr-qa/analysis.json" \
            --min-score 90 \
            --target apps/canary-pr-qa-ui \
            --report "$RUNNER_TEMP/arcovia/pr-qa-ui/analysis.json" \
            --min-score 95

      - name: Preserve architecture reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcovia-reports
          path: ${{ runner.temp }}/arcovia
          if-no-files-found: ignore
